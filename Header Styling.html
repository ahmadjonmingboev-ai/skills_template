<script type="text/javascript">
// Helper function to get Confluence metadata
function getMeta(metaName) {
  const metas = document.getElementsByTagName('meta');
  for (let i = 0; i < metas.length; i++) {
    if (metas[i].getAttribute('name') === metaName) {
      return metas[i].getAttribute('content');
    }
  }
  return '';
}

// Helper function to debounce multiple repeated events in a short time into one call
function debounce(fn, delay) {
  var timer = null;
  return function () {
    var context = this, args = arguments;
    clearTimeout(timer);
    timer = setTimeout(function () {
      fn.apply(context, args);
    }, delay);
  };
}

// Helper function for easy logging
function clog(message) {
  console.log("ProstaLog: " + message);
}

// Function to add "synchrony-active" class, and "theme-documentation" class to body to prevent janky header behaviour
function styleHeader() {
  document.querySelector("body").classList.add("theme-documentation", "synchrony-active");

  // Set FavIcon
  var link = document.querySelector("head link[rel~='icon']");
  if (!link) {
    link = document.createElement('link');
    link.rel = 'icon';
    document.head.appendChild(link);
  }
  var iconLinks = document.querySelectorAll("head link[rel~='icon']");
  if (iconLinks) {
    iconLinks.forEach((v) => {
      v.href = 'url_icon';
    });
  }
}

validFlags = ["hide-sidebar", "hide-title", "hide-breadcrumbs", "hide-likes", "hide-labels", "hide-comments", "hide-footer", "hide-pagemeta", "disable-tablefilter", "disable-imagegallery", "centered", "hide-actions", "sectioncards"];

function prostastyleAdd(...flags) {
  for (let flag of flags) {
    if (validFlags.includes(flag.toLowerCase())) {
      document.querySelector("body").classList.add("prosta-" + flag.toLowerCase());
    } else {
      clog("ProstaHeader: prostastyleAdd - Invalid flag (" + flag + ")");
    }
  }
}

function prostastyleRemove(...flags) {
  for (let flag of flags) {
    if (validFlags.includes(flag.toLowerCase())) {
      document.querySelector("body").classList.remove("prosta-" + flag.toLowerCase());
    } else {
      clog("ProstaHeader: prostastyleRemove - Invalid flag (" + flag + ")");
    }
  }
}

function styleLabelStyles() {
  var labels = document.querySelectorAll("#labels-section a.aui-label-split-main");
  labels.forEach((label) => {
    var lbl = label.innerText.toLowerCase();
    if (lbl.startswith("remove-") || lbl.startswith("show-")  || lbl.startswith("enable-")) {
      var removeLabel = lbl.replace("remove-", "").replace("show-", "hide-").replace("enable-", "disable-");
      if (validFlags.includes(removeLabel)) {
        prostastyleRemove(removeLabel);
      }
    } else if (validFlags.includes(lbl)) {
      prostastyleAdd(lbl);
    }
  });
}

// Function to initialize Navbar
function styleNavbar() {

  // Add button classes to all links in the button-links UL
  document.querySelectorAll("div#prosta-navbar .button-links ul li a").forEach((v) => {
    v.classList.add("contentf-button", "aui-button", "aui-button-subtle", "output-inline");
  });

  // Delete anything in the Buttons div that isn't the list of links
  document.querySelectorAll("div#prosta-navbar div.button-links > *:not(ul)").forEach((elem) => { elem.remove(); });

  // Remove any empty paragraphs in the custom header
  document.querySelectorAll("div#custom-content-header p:empty").forEach((elem) => { elem.remove(); });
  document.querySelectorAll("div#custom-content-header div[data-macro-name='include'] > p").forEach((elem) => { elem.remove(); });

  clog("ProstaStyle: Add System Buttons");

  var navDiv = document.querySelector("div#prosta-navbar");
  var siteLogo = document.querySelector("div#prosta-navbar div.site-logo");
  var siteLogoImg = document.querySelector("div#prosta-navbar div.site-logo img");
  var siteTitle = document.querySelector("div#prosta-navbar div.site-title");

  // Group the Site Logo and the Site Title into one item, add a link to "home", and move into the start of the navbar
  if (navDiv && siteLogo && siteLogoImg && siteTitle) {
    var aHome = document.createElement("a");
    aHome.classList.add("site-logo");
    aHome.setAttribute("href", window.location.origin + "/confluence/display/" + getMeta("ajs-space-key"));
    aHome.appendChild(siteLogoImg);
    aHome.appendChild(siteTitle);
    siteLogo.appendChild(aHome);
  }

  // Delete anything in the SiteLogo div that isn't the link
  document.querySelectorAll("div#prosta-navbar div.site-logo > *:not(.site-logo)").forEach((elem) => { elem.remove(); });

  // Create the top-right "actions" button bar
  var actionBar = document.createElement("ul");
  actionBar.classList.add("navbar-actions");
  navDiv.appendChild(actionBar);

  // Create the System Buttons - Logon or Create/Search
  var confLoginBtn = document.getElementById("login-link");
  if (confLoginBtn) {

    // ==============================================================
    // Login Button

    var custLoginBtn = document.getElementById("ux-login-button");
    var bLogin = document.createElement("a");
    bLogin.setAttribute("href", confLoginBtn.href);
    bLogin.setAttribute("id", "ux-login-button");
    bLogin.innerText = "Log in";
    bLogin.classList.add("system-button", "contentf-button", "aui-button", "output-inline");
    actionBar.appendChild(bLogin);

    // ==============================================================
    // Search Button

    var confQuickSearch = document.getElementById("quick-search-query-button");
    if (confQuickSearch) {
      var bSearch = document.createElement("button");
      bSearch.setAttribute("id", "ux-search-button");
      bSearch.innerHTML = "<span class='aui-icon aui-icon-small aui-iconfont-search'>search</span><span id='search-button-label'> Search</span>";
      bSearch.classList.add("contentf-button", "aui-button", "aui-button-subtle", "output-inline");
      actionBar.appendChild(bSearch);
      document.getElementById("ux-search-button").addEventListener('click', function (event) {
        event.preventDefault();
        confQuickSearch.click();
      });
    }

  } else {

    // ==============================================================
    // "Create" Button - Split button with standards button on left and "..." template on the right

    var bCreate = document.createElement("a");
    var confCreateBtn = document.getElementById("quick-create-page-button");
    if (confCreateBtn) {
      bCreate.setAttribute("href", confCreateBtn.href);
      bCreate.setAttribute("id", "ux-create-page-button");
      bCreate.innerHTML = "<span class='aui-icon aui-icon-small aui-iconfont-add'></span><span class='label'>Create</span>";
      bCreate.classList.add("contentf-button", "aui-button", "output-inline");

      var bCreateFromTemplate = document.createElement("a");
      bCreateFromTemplate.setAttribute("id", "ux-create-page-with-template-button");
      bCreateFromTemplate.classList.add("contentf-button", "aui-button", "output-inline", "clc-create-dialog-btn");
      bCreateFromTemplate.addEventListener('click', () => { document.getElementById("create-page-button").click(); });

      var createFromTemplateIcon = document.createElement("span");
      createFromTemplateIcon.classList.add("aui-icon", "aui-icon-small", "aui-iconfont-more");
      bCreateFromTemplate.appendChild(createFromTemplateIcon);

      var splitBtn = document.createElement("div");
      splitBtn.classList.add("split-button", "output-inline");
      splitBtn.appendChild(bCreate);
      splitBtn.appendChild(bCreateFromTemplate);

      actionBar.appendChild(splitBtn);
    }

    // ==============================================================
    // Search Button

    var confQuickSearch = document.getElementById("quick-search-query-button");
    if (confQuickSearch) {
      var bSearch = document.createElement("button");
      bSearch.setAttribute("id", "ux-search-button");
      bSearch.innerHTML = "<span class='aui-icon aui-icon-small aui-iconfont-search'>search</span><span id='search-button-label'> Search</span>";
      bSearch.classList.add("contentf-button", "aui-button", "aui-button-subtle", "output-inline");
      actionBar.appendChild(bSearch);
      document.getElementById("ux-search-button").addEventListener('click', function (event) {
        event.preventDefault();
        confQuickSearch.click();
      });
    }

    // ==============================================================
    // Avatar Button
    var confUserMenuLink = document.getElementById("user-menu-link");
    if (confUserMenuLink) {
      actionBar.appendChild(confUserMenuLink.parentElement).classList.add("aui-button", "avatar-button");
    }
  }
}

// === Overflow Handling ==============================

function navResize() {
  var navLinks = document.querySelector('.button-links');
  var navLinksList = document.querySelector('.button-links > ul');
  var navMore = document.querySelector('#nav-more');
  var navMoreLabel = document.querySelector('#more-label');

  var navSpace = navLinks.offsetWidth;

  var linkswidth = 4; // Allow for 4px buffer
  var visibleLinks = document.querySelectorAll('.button-links > ul > li:not(#nav-more)');
  visibleLinks.forEach((elem) => {
    linkswidth += elem.offsetWidth;
  });

  var allLinkswidth = linkswidth;
  var overflowLinks = document.querySelectorAll('#nav-overflow > li');
  overflowLinks.forEach((elem) => {
    allLinkswidth += parseInt(elem.getAttribute("data-width"),10);
  });

  // Determine if the "More" menu needs to be shown
  if (allLinkswidth > navSpace) {
    navMore.classList.remove("hide");
    linkswidth += navMore.offsetWidth;
  } else {
    navMore.classList.add("hide");
  }

  if (linkswidth > navSpace) {
    // Iteratively move links from the navbar to the overflow until the navbar stops overflowing
    while ((linkswidth > navSpace) && (document.querySelectorAll('.button-links > ul > li:not(#nav-more)').length > 0)) {
      var visibleLinks = document.querySelectorAll('.button-links > ul > li:not(#nav-more)');
      var lastLink = visibleLinks[visibleLinks.length-1];
      var lastLinkwidth = lastLink.offsetWidth;
      lastLink.setAttribute("data-width", lastLinkwidth );
      document.querySelector('#nav-overflow').prepend(lastLink);
      linkswidth = linkswidth - lastLinkwidth;
    }
  } else {
    // Iteratively move links from the overflow back into the menu until we fill the navbar without overflowing
    while ((linkswidth <= navSpace) && (document.querySelectorAll('#nav-overflow > li').length > 0)) {
      var firstOverflowLink = document.querySelectorAll('#nav-overflow > li')[0];
      var firstOverflowLinkwidth = parseInt(firstOverflowLink.getAttribute("data-width"),10);
      if ((navSpace - linkswidth) > firstOverflowLinkwidth) {
        navLinksList.insertBefore(firstOverflowLink, navMore);
      }
      linkswidth = linkswidth + firstOverflowLinkwidth;
    }
    // Hide "More" menu if there's nothing left in overflow
    if (document.querySelectorAll('#nav-overflow > li').length == 0) {
      navMore.classList.add("hide");
    }
  }
}

function styleOverflow() {
  // Add "More" overflow button
  var ulLinks = document.querySelector("div#prosta-navbar .button-links > ul");
  ulLinks.insertAdjacentHTML("beforeend", "<li id='nav-more'><div class='dropdown'><a class='dropdown-toggle aui-button aui-button-subtle' href='#' id='more-label'>More</a><ul class='dropdown-menu' id='nav-overflow'></ul></div></li>");

  // Set up resize handlers
  window.addEventListener("resize", debounce(navResize, 50));

  // Trigger initial resize
  navResize();
}

// === Dropdown Handling ==============================

function toggleDropdown(event) {
  event.preventDefault();
  var dropdown = event.target.closest(".dropdown");
  if (dropdown) {
    var dropdownMenu = dropdown.querySelector(".dropdown-menu");
    if (dropdownMenu) {
      dropdownMenu.classList.toggle("show");
    }
  }
}

function styleDropdowns() {
  // Toggle dropdown on click, and handle clicks
  // outside the dropdown will close the dropdown
  document.addEventListener('click', function(event) {
    var dropdown = event.target.closest(".dropdown");
    if (dropdown) {
      toggleDropdown(event);
    } else {
      var openDropdown = document.querySelector(".dropdown-menu.show");
      if (openDropdown) {
        openDropdown.classList.remove("show");
      }
    };
  });

  // Toggle dropdown on Enter keypress
  document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      var dropdown = event.target.closest(".dropdown");
      if (dropdown) {
        toggleDropdown(event);
      }
    }
  });

  // Close dropdown on losing focus
  window.addEventListener('blur', function(event) {
    var openDropdown = document.querySelector(".dropdown-menu.show");
    if (openDropdown) {
      openDropdown.classList.remove("show");
    };
  });
}

// === Actions Menu ==============================

function styleActionsMenu() {
  //Move actions menu into header
  var navActions = document.querySelector(".navbar-actions");
  var avatarButton = document.querySelector(".avatar-button");
  var editButton = document.querySelector("#navigation > ul > li:has(a#editPageLink)");
  if (editButton) { navActions.insertBefore(editButton, avatarButton); }
  var menuButton = document.querySelector("#navigation > ul > li.ajs-menu-item:has(a#action-menu-link)");
  if (menuButton) { navActions.insertBefore(menuButton, avatarButton); }

  var auiNavigation = document.getElementById("navigation");
  var auiCompactBtn = document.getElementById("extender-content-compact-view");
  if ( auiNavigation && auiCompactBtn) { auiNavigation.appendChild(auiCompactBtn.parentElement); }
}

// === Image Gallery ==============================

function styleImageGallery() {
  var imgs = document.querySelectorAll("span.confluence-embedded-file-wrapper:has(img)");
  imgs.forEach((img) => {
    img.addEventListener("click", function(event) {
      if (event.button == 0 && document.querySelector("body").classList.contains("prosta-disable-imagegallery")) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    });
  });
}

// === Background Images ==============================

function styleBackgroundImages() {
  var imgs = document.querySelectorAll(".cell .prosta-bg-image img");
  if (imgs) {
    imgs.forEach((img) => {
      var url = img.src;
      var cell = img.closest("div.cell");
      cell.style.backgroundImage = "url('" + url + "')";
    });
  }
}

// === Jump links Handling ==============================

function styleJumplinks() {
  if (document.querySelector('.toc-macro.jumplinks')) {
    clog("ProstaHeader: Jumplinks TOC Found");
    document.querySelector("div#main-content.wiki-content").classList.add("jumplinks");
    document.querySelector("div#page").addEventListener("scroll", debounce(scrollTrack, 100));
    setTimeout(scrollTrack, 1000);
  }
}

function scrollTrack() {
  // Get list of all H1 items in the main content
  clog("ProstaHeader: SCROLLTRACK");
  let headings = document.querySelectorAll('#main-content h1, #main-content h2, #main-content h3, #main-content h4, #main-content h5, #main-content h6');

  if (headings.length == 0) { return false; }
  let activeId = headings[0].id;

  // Find the active heading
  for (let i=headings.length-1; i > -1; i--) {
    let ypos = headings[i].getBoundingClientRect().y;
    activeId = "#" + headings[i].id;
    // Active header in top third of screen
    if (ypos < (window.innerHeight / 3)) {
      //If this is the only header in the top third, its the one
      if ((i == 0) || (headings[i-1].getBoundingClientRect().y < 76)) break;
    }
  }

  // Sets one of the jumplinks to active, and unsets all the others, so active link is highlighted
  let jumplinks = document.querySelectorAll('.toc-macro.jumplinks a');
  jumplinks.forEach((v) => {
    if (v.hash && (v.hash == activeId)) {
      v.closest("li").classList.add("active");
    } else {
      v.closest("li").classList.remove("active");
    }
  });
}

// === Kiosk Mode ==============================

function styleKiosk() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("kiosk") === "true") {
    document.body.classList.add("prosta-hide-sidebar");
  }
}

// Main function
function initprostastyle() {
  document.addEventListener("DOMContentLoaded", function(event) {
    clog("ProstaStyle: Fix Header");
    styleHeader();
    clog("ProstaStyle: Init NavBar");
    styleNavbar();
    clog("ProstaStyle: Init Jumplinks");
    styleJumplinks();
    clog("ProstaStyle: Init Overflow");
    styleOverflow();
    clog("ProstaStyle: Init Dropdowns");
    styleDropdowns();
    clog("ProstaStyle: Init Actions Menu");
    styleActionsMenu();
    clog("ProstaStyle: Apply Label Styles");
    styleLabelStyles();
    clog("ProstaStyle: Apply Kiosk");
    styleKiosk();
    clog("ProstaStyle: Image Gallery ");
    styleImageGallery();
    clog("ProstaStyle: Section Background Images");
    styleBackgroundImages();
    //Resize one more time at the end
    navResize();
  });
}
